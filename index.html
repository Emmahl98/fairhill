const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
let previewUrl=null;
const frame=document.querySelector('#site');
const form=document.querySelector('#unlock'),status=document.querySelector('#status'),button=document.querySelector('#enter'),password=document.querySelector('#password');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Unlocking preview…';password.removeAttribute('aria-invalid');try{
 if(!window.crypto?.subtle)throw Error('secure-context');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
 // The app is decrypted only in this tab; there is no public unprotected page.
 if(previewUrl)URL.revokeObjectURL(previewUrl);
 previewUrl=URL.createObjectURL(new Blob([new TextDecoder().decode(clear)],{type:'text/html'}));
 frame.src=previewUrl+window.location.hash;password.value='';
 document.querySelector('#gate').hidden=true;document.querySelector('#stripe').hidden=true;document.querySelector('#preview').hidden=false;
 document.title='Fairhill Government | Preview';status.textContent='';document.querySelector('#lock').focus();
 }catch(error){status.textContent=error.message==='secure-context'?'The preview needs HTTPS. Open the secure website address.':'That password didn’t work. Please try again.';password.setAttribute('aria-invalid','true');password.focus();password.select();}finally{button.disabled=false;}
});
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.type!=='fairhill-route')return;const hash=event.data.hash;if(typeof hash==='string'&&/^#(?:home|government|documents|gazette|contact)(?:\/[A-Za-z0-9-]+)?$/.test(hash))history.replaceState(null,'',location.pathname+location.search+hash);});
